[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rolecard"
version = "0.1.2"
description = "Local, private job-search assistant: score offers against your CV, tailor applications and track them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Direct dependencies, pinned. The full pinned lock with hashes is requirements.txt.
dependencies = [
    "flask==3.1.3",
    "sqlalchemy==2.1.9",
    "pypdf==7.1.1",
    "reportlab==5.1.0",
    "python-docx==1.2.0",
    "waitress==3.0.2",
]

[project.scripts]
rolecard = "rolecard.cli:main"

[tool.setuptools.packages.find]
include = ["rolecard*"]

[tool.setuptools.package-data]
rolecard = ["migrations/*.sql", "locales/*.json", "templates/**/*.html", "static/**/*"]
